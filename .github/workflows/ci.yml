name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

          pattern='(securezone[_-]?pass|Test123|MyUser|mongodb://[^[:space:]]+:[^[:space:]@]+@|XPCO|192\.168\.)'

          if rg -n --hidden --glob '!.git/**' --glob '!.github/workflows/ci.yml' --glob '!*.example' "$pattern" .; then
            echo "Potential secret or environment-specific value found. Replace it with an environment variable or placeholder."
            exit 1
          fi

  docker-compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate MongoDB Docker Compose
        shell: bash
        env:
          MONGO_HOST_PORT: "27018"
          MONGO_INITDB_ROOT_USERNAME: "ci_user"
          MONGO_INITDB_ROOT_PASSWORD: "ci_password"
          MONGO_INITDB_DATABASE: "securezone"
        run: |
          set -euo pipefail
          docker compose -f deployment/mongodb/docker-compose.yml config

      - name: Validate runtime Docker Compose
        shell: bash
        env:
          MONGO_INITDB_ROOT_USERNAME: ci_user
          MONGO_INITDB_ROOT_PASSWORD: ci_password
          MONGO_INITDB_DATABASE: securezone
          SECUREZONE_MONGO_URI: mongodb://ci_user:ci_password@mongodb:27017/securezone?authSource=admin
          SECUREZONE_XPROTECT_API_KEY: ci-test-only-api-key
          SECUREZONE_API_HOST_PORT: "8080"
        run: |
          set -euo pipefail
          docker compose -f deployment/runtime/docker-compose.yml config

  backend-core:
    name: Core build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake core build
        run: |
          cmake -S . -B build -DSECUREZONE_BUILD_MONGODB_INFRA=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build core targets
        run: |
          cmake --build build --config Debug --parallel 2

      - name: Run core tests
        run: |
          ctest --test-dir build -C Debug --output-on-failure

  backend-mongodb:
    name: MongoDB infrastructure build and mapper tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake MongoDB infrastructure build
        run: |
          cmake -S . -B build-mongodb \
            -DSECUREZONE_BUILD_MONGODB_INFRA=ON \
            -DSECUREZONE_BUILD_MONGODB_TESTS=ON \
            -DSECUREZONE_BUILD_MONGODB_INTEGRATION_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build MongoDB infrastructure targets
        run: |
          cmake --build build-mongodb --config Debug --parallel 2

      - name: Run MongoDB mapper tests
        run: |
          ctest --test-dir build-mongodb -C Debug -L mongodb --output-on-failure
